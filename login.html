
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - SportZone</title>
    <link rel="stylesheet" href="css/style1.css">
</head>
<body>

<div class="auth-container">
    <div class="auth-box">
        <h1>SPORT<span>ZONE</span></h1>
        <h2>Đăng nhập</h2>
        <p class="auth-desc">Chào mừng bạn quay trở lại!</p>

        <form>
            <label>Email</label>
            <input id="email"  type="email" placeholder="Nhập email của bạn" required>

            <label>Mật khẩu</label>
            <input id="password" type="password" placeholder="Nhập mật khẩu" required>

            <div class="auth-options">
                <label class="remember">
                    <input type="checkbox"> Ghi nhớ tôi
                </label>
                <a href="#">Quên mật khẩu?</a>
            </div>

            <button type="submit" class="auth-button">
                Đăng nhập
            </button>
        </form>

        <p class="auth-switch">
            Chưa có tài khoản?
            <a href="register.html">Đăng ký ngay</a>
        </p>

        <a href="index.html" class="back-home">← Quay về trang chủ</a>
    </div>
</div>
<script src="./scripts/login.js"></script>

</body>
</html>
