
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - SportZone</title>
    <link rel="stylesheet" href="css/style1.css">
</head>
<body>

<div class="auth-container">
    <div class="auth-box">
        <h1>SPORT<span>ZONE</span></h1>
        <h2>Đăng nhập</h2>
        <p class="auth-desc">Chào mừng bạn quay trở lại!</p>

        <p class="auth-demo-note">Tài khoản demo lưu trên trình duyệt. Không dùng mật khẩu thật.</p><form>
            <label for="email">Email</label>
            <input id="email" autocomplete="username" type="email" placeholder="Nhập email của bạn" required>

            <label for="password">Mật khẩu</label>
            <input id="password" autocomplete="current-password" type="password" placeholder="Nhập mật khẩu" required>

            <!-- Ghi nhớ/quên mật khẩu: chỉ thêm khi đã xử lý được luồng. -->

            <button type="submit" class="auth-button">
                Đăng nhập
            </button>
        </form>

        <p class="auth-switch">
            Chưa có tài khoản?
            <a href="register.html">Đăng ký ngay</a>
        </p>

        <a href="index.html" class="back-home">← Quay về trang chủ</a>
    </div>
</div>
<script src="./scripts/login.js"></script>

</body>
</html>
